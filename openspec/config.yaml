schema: spec-driven

context: |
  Language: Vietnamese
  All artifacts must be written in Vietnamese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Dự án: "Chia tiền" (Fee Calculator) — ứng dụng web chạy hoàn toàn phía client,
  chia tiền nhóm bạn theo 3 tầng: Bữa (Meal) → Kèo (Session) → Món (Item).
  Không có backend; dữ liệu nằm trong trình duyệt của người dùng.

  Công nghệ: React 19 + TypeScript + Vite, Tailwind CSS, Dexie (IndexedDB),
  OPFS cho file hoá đơn, onnxruntime-web (VietOCR), @huggingface/transformers
  (AI cục bộ), pdfjs-dist, lz-string (Snapshot URL), Vitest + Testing Library, oxlint.

  Cấu trúc mã nguồn (trong app/src):
  - domain/     quy tắc nghiệp vụ thuần, không phụ thuộc UI hay DB
  - services/   thao tác dữ liệu (Dexie, file, OCR, AI, snapshot)
  - db/         schema Dexie, chuẩn hoá, seed
  - components/ pages/ hooks/   giao diện React
  - i18n/       từ điển vi (index.ts) và en (en.ts), phải cùng tập khoá
  - lib/        tiện ích (tiền, ngày, ảnh, PDF)
  - workers/    web worker cho OCR và AI

  Quy ước:
  - Tiền là VNĐ, số nguyên; mọi phép chia phải khớp tổng tuyệt đối (không lệch 1 đồng).
  - Mọi chuỗi giao diện đi qua i18n, có đủ ở cả vi và en.
  - Bữa đã lưu trữ (ARCHIVED) và trang Snapshot là chỉ đọc.
  - Tên kiểu/hàm/bảng giữ nguyên tiếng Anh trong dấu `code`.
  - Lệnh kiểm tra chạy trong app/: `npm test`, `npm run lint`, `npm run build`.
  - Không commit thẳng lên main; mọi thay đổi qua branch riêng và Pull Request.
    Không dùng --no-verify hay SKIP_PAGES_BUILD=1 để lách, trừ khi người phụ trách đồng ý.
  - Thư mục docs/ là bản build GitHub Pages (phục vụ từ main, thư mục /docs, base ./),
    không sửa tay. Hook .githooks/post-merge tự build và commit "Build docs (<sha>)"
    sau mỗi merge hoặc pull vào main; build tay bằng .githooks/build-docs.sh.
    Hook được bật qua core.hooksPath=.githooks (tự đặt khi npm install trong app/).
  - File mô hình lớn (app/public/ocr/vietocr/vietocr_encoder.onnx) dùng Git LFS;
    hook .githooks/pre-push đẩy file LFS khi push.

  Tài liệu của dự án:
  - openspec/specs/<capability>/spec.md là nguồn sự thật về hành vi hiện tại (14 capability).
  - openspec/changes/archive/ giữ lịch sử: thiết kế gốc (initial-system-design, epic-1 đến
    epic-9, kèm nguyên văn tài liệu cũ trong design.md) và các thay đổi sau đó theo ngày.
  - Không có thư mục tài liệu riêng; không viết tài liệu thiết kế ngoài OpenSpec.
  - Tính năng mới đi qua skill new-feature (.claude/skills/new-feature/SKILL.md).
  - CLI: npm i -g @fission-ai/openspec@1.17.0 (Node 22.12 trở lên).

rules:
  proposal:
    - Nêu rõ phần ngoài phạm vi (Non-goals).
    - Ghi capability trong openspec/specs/ bị ảnh hưởng, đúng tên thư mục hiện có.
  specs:
    - Mỗi Requirement có ít nhất một Scenario dạng WHEN/THEN kiểm chứng được.
    - Mô tả hành vi quan sát được, không mô tả chi tiết cài đặt.
  design:
    - Chỉ rõ thay đổi schema Dexie (bảng, index, version) hoặc ghi "không đổi".
    - Chỉ rõ ảnh hưởng tới Snapshot URL và khả năng mở link cũ.
  tasks:
    - Có task viết test (Vitest) cho từng Requirement mới hoặc thay đổi.
    - Có task thêm khoá i18n cho cả vi và en khi có chuỗi giao diện mới.
    - Task cuối chạy `npm test`, `npm run lint`, `npm run build` trong app/.
